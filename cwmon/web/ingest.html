<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cantina Radar · importazione</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16110f;color:#f3ebe4;
       font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .box{max-width:480px;padding:32px;text-align:center}
  h1{font:600 26px Georgia,serif;margin:0 0 12px} h1 span{color:#d6b26e;font-style:italic;font-weight:400}
  #s{color:#a8978b} .ok{color:#5fbf8a!important} .err{color:#c95b5b!important}
  a{color:#d6b26e}
</style></head>
<body><div class="box">
  <h1>Cantina <span>Radar</span></h1>
  <p id="s">Lettura dei dati…</p>
</div>
<script>
const s = document.getElementById("s");
function say(t, cls) { s.textContent = t; s.className = cls || ""; }
(async () => {
  const raw = location.hash.slice(1);
  if (!raw) {
    return say("Nessun dato ricevuto. Apri una pagina di Catawiki (per esempio le aste di vino) e premi il pulsante Cantina Radar nei preferiti.", "err");
  }
  history.replaceState(null, "", location.pathname);  // toglie i dati dall'indirizzo
  let d;
  try { d = JSON.parse(decodeURIComponent(raw)); }
  catch (e) { return say("Dati non leggibili: reinstalla il pulsante dalla pagina installa.html.", "err"); }
  say(`Analisi di ${d.lots.length} lotti…`);
  try {
    const r = await fetch("/api/ingest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    say(`✓ ${j.lotti} lotti letti (${j.nuovi} nuovi) · ${j.con_offerta} con offerta aggiornata · ` +
        `${j.occasioni} occasioni sopra soglia · ${j.avvisi} avvisi Telegram` +
        (j.live_status && j.live_status !== 200 ? ` · offerte live non disponibili (${j.live_status})` : ""), "ok");
    setTimeout(() => location.href = "/?import=" + Date.now(), 2500);
  } catch (err) {
    say("Errore dell'app: " + err.message + ". La finestra nera di Cantina Radar è aperta?", "err");
  }
})();
</script>
</body></html>
