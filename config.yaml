# Configurazione di Catawiki Wine Monitor
# Modifica questi valori e salva: verranno usati al ciclo successivo.

catawiki:
  # NB: la raccolta automatica non funziona perché Catawiki blocca le richieste dei programmi.
  # Si usa il pulsante nel browser (vedi README). Queste impostazioni valgono solo per "doctor".
  # Categorie da monitorare (ID Catawiki)
  #   443 = Vino, 961 = Champagne, 971 = Porto e vini dolci
  #   437 = Whisky, 965 = Rum, Cognac e distillati (il parser è pensato per il vino)
  categories: [443, 961, 971]
  # Quanti giorni di chiusura leggere ad ogni ciclo (1 = solo oggi, 2 = oggi e domani)
  days_ahead: 2
  # Pagine massime per categoria e per giorno (25 lotti per pagina)
  max_pages: 15
  # Pausa tra le richieste, in secondi: tienila >= 1.5 per non sovraccaricare il sito
  request_delay: 2.0
  # Lingua dei link nei messaggi e nella dashboard
  link_locale: it
  # Lingua usata per leggere i titoli (lasciare "en": il parser è tarato sui titoli inglesi)
  scrape_locale: en
  # Quanti lotti in chiusura aprire ad ogni ciclo per leggere la stima dell'esperto
  max_detail_pages: 30

costi:
  # Commissione acquirente Catawiki (Buyer Protection): 9% + 3 € per lotto
  commissione_pct: 0.09
  commissione_fissa: 3.0
  # Paese di consegna: italia o spagna (si cambia anche dalla dashboard)
  paese: italia
  # Spedizione stimata per paese: costo per lotto + supplemento per ogni bottiglia oltre la prima (€).
  # La spedizione reale dipende dal venditore ed è indicata sulla pagina del lotto.
  # Questi valori si possono modificare anche dalla dashboard, nel riquadro "Il tuo obiettivo".
  spedizione:
    italia: {lotto: 25.0, extra_bottiglia: 2.0}
    spagna: {lotto: 25.0, extra_bottiglia: 2.0}

valutazione:
  # File con i tuoi prezzi di riferimento (prezzo per bottiglia 0,75 L)
  file_riferimenti: riferimenti.csv
  # Somiglianza minima (0-100) per abbinare un lotto a un riferimento o allo storico
  match_minimo: 88
  # Giorni di storico delle aste chiuse da considerare
  giorni_storico: 365

avvisi:
  # Sconto minimo rispetto al valore di mercato per ricevere un avviso (0.25 = 25%)
  sconto_minimo: 0.25
  # Avvisa solo per lotti che chiudono entro queste ore
  ore_alla_chiusura: 3
  # Affidabilità minima della valutazione (0-1)
  affidabilita_minima: 0.5
  # Punteggio Vivino minimo (scala 1-5, es. 4.0). 0 = nessun filtro.
  # Si può cambiare anche dalla dashboard, nel riquadro "Il tuo obiettivo".
  punteggio_minimo: 0
  # Budget massimo per lotto (offerta corrente, €). 0 = nessun limite
  budget_massimo: 0
  # Ignora i lotti con prezzo di riserva non ancora raggiunto
  escludi_riserva_non_raggiunta: true
  # Secondo avviso "ultima chiamata" quando mancano meno di N minuti
  ultima_chiamata_minuti: 45
  # Parole chiave: se la lista "includi" non è vuota, avvisa solo per i lotti che ne contengono almeno una
  includi: []
  escludi: ["vinegar", "aceto", "olive oil"]

dashboard:
  # Cartella in cui viene generata la dashboard web
  cartella: site
  # Mostra in dashboard solo i lotti che chiudono entro N ore (0 = tutti quelli tracciati e aperti)
  ore_max: 48

browser:
  # Quante pagine legge il pulsante "Cantina Radar" a ogni pressione (25 lotti per pagina),
  # a partire da quella che stai guardando. Dopo una modifica, reinstalla il pulsante dalla pagina installa.html
  pagine: 4
  # Quante pagine di singoli lotti aprire a ogni pressione per leggere spedizione e commissione
  # (ogni lotto viene letto una sola volta; prima quelli che chiudono presto)
  dettagli: 20

vivino:
  # Cerca automaticamente il punteggio Vivino dei vini (una volta ogni 30 giorni per vino)
  attivo: true
  # Pausa tra le ricerche, in secondi (minimo 4)
  pausa: 4.0
  # Ricerche massime a ogni pressione del pulsante (solo vini che chiudono entro 48 ore).
  # Se Vivino rifiuta le richieste, l'app si ferma per 12 ore.
  ricerche: 12
