<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cantina Radar · importazione</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16110f;color:#f3ebe4;
       font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .box{max-width:460px;padding:32px;text-align:center}
  h1{font:600 26px Georgia,serif;margin:0 0 12px} h1 span{color:#d6b26e;font-style:italic;font-weight:400}
  #s{color:#a8978b} .ok{color:#5fbf8a} .err{color:#c95b5b}
  a{color:#d6b26e}
</style></head>
<body><div class="box">
  <h1>Cantina <span>Radar</span></h1>
  <p id="s">In attesa dei dati da Catawiki…</p>
</div>
<script>
const s = document.getElementById("s");
const CW = /^https:\/\/([a-z0-9-]+\.)*catawiki\.[a-z.]+$/;
let got = false;
function say(t, cls) { s.textContent = t; s.className = cls || ""; }
fetch("/api/pending").then(r => r.json()).catch(() => ({ need: [] })).then(p => {
  let n = 0;
  const t = setInterval(() => {
    if (got) return clearInterval(t);
    if (++n > 40 || !window.opener) {
      clearInterval(t);
      say("Nessun dato ricevuto. Apri una pagina di Catawiki (per esempio le aste di vino) e premi il pulsante Cantina Radar nei preferiti.", "err");
      return;
    }
    window.opener.postMessage({ type: "ready", need: p.need || [] }, "*");
  }, 400);
});
addEventListener("message", async e => {
  if (!CW.test(e.origin) || !e.data || got) return;
  if (e.data.type === "error") { got = true; return say("Errore nella lettura della pagina: " + e.data.message, "err"); }
  if (e.data.type !== "data") return;
  got = true;
  const d = e.data.payload;
  say(`Analisi di ${d.lots.length} lotti…`);
  try {
    const r = await fetch("/api/ingest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    say(`✓ ${j.lotti} lotti letti (${j.nuovi} nuovi) · ${j.con_offerta} con offerta aggiornata · ` +
        `${j.occasioni} occasioni sopra soglia · ${j.avvisi} avvisi Telegram`, "ok");
    setTimeout(() => location.href = "/?import=" + Date.now(), 1800);
  } catch (err) {
    say("Errore dell'app: " + err.message, "err");
  }
});
</script>
</body></html>
